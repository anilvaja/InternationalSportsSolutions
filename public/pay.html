<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Fee Payment & Receipt Verification — International Sports Solutions</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- jsPDF, AutoTable & html2pdf for client-side printable receipts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="/js/html2pdf.bundle.min.js"></script>
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: radial-gradient(circle at top center, #1e293b, #0f172a); min-height: 100vh; padding: 40px 20px;">

  <div style="max-width: 680px; margin: 0 auto;">
    
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #10b981, #0ea5e9); display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 26px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);">
        <i class="fa-solid fa-receipt"></i>
      </div>
      <h1 style="font-size: 24px; font-weight: 700; color: #fff;">Student Fee Quick-Pay Portal</h1>
      <p style="font-size: 14px; color: var(--text-muted); margin-top: 6px;">Pay academy fees online or verify and download official payment receipts</p>
    </div>

    <!-- Search Card -->
    <div class="content-card" style="padding: 24px;">
      <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 16px;">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--secondary);"></i> Find Outstanding Invoices
      </h2>

      <form id="pay-search-form">
        <div class="form-group">
          <label>Select Sports Academy</label>
          <select id="pay-academy-select" class="form-select" style="width: 100%;" required>
            <option value="">Loading academies...</option>
          </select>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Student Code (e.g. STU-1001)</label>
            <input type="text" id="pay-student-code" class="form-input" style="width: 100%;" placeholder="STU-XXXX">
          </div>
          <div class="form-group">
            <label>OR Invoice Number</label>
            <input type="text" id="pay-invoice-number" class="form-input" style="width: 100%;" placeholder="INV-XXXX-XXXX">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
          <i class="fa-solid fa-search"></i> Search Invoices
        </button>
      </form>
    </div>

    <!-- Results Container -->
    <div id="pay-results-container" style="display: none;">
      <!-- Populated via JavaScript -->
    </div>

    <!-- Success / Receipt Container -->
    <div id="pay-receipt-container" style="display: none;" class="content-card">
      <!-- Populated after successful payment -->
    </div>

    <div style="text-align: center; margin-top: 24px;">
      <a href="/" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">
        ← Back to Staff & Admin Login
      </a>
    </div>

  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/js/pay.js?v=2.5.4"></script>
</body>
</html>
