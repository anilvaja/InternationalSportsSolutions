<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Sports Solutions — SaaS Platform</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Client-side PDF & Excel Libraries (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  
  <!-- Leaflet Map Library for GPS Geofencing Visualizer -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css?v=2.2.0">
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. LOGIN VIEW                              -->
  <!-- ========================================== -->
  <div id="login-view" style="display: none; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-main); padding: 20px;">
    <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="width: 52px; height: 52px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #0ea5e9); display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 24px; margin-bottom: 12px;">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <h2 style="font-size: 20px; font-weight: 700; color: var(--text-heading);">International Sports Solutions</h2>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Multi-Tenant SaaS Portal (Database-per-Tenant)</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-input" style="width: 100%;" required placeholder="admin@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-input" style="width: 100%;" required placeholder="••••••••">
        </div>
        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
          <label style="margin: 0; display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="login-remember" checked> Remember me
          </label>
          <a href="/pay.html" style="font-size: 12px; color: var(--secondary); text-decoration: none;">Quick Pay Portal →</a>
        </div>
        <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px; margin-top: 8px;">
          Sign In to Portal
        </button>
      </form>

      <!-- Quick Demo Login Pickers -->
      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border);">
        <p style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 8px;">Demo One-Click Sign In:</p>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="app.quickFill('anilvaja.007@gmail.com', 'password')" style="justify-content: flex-start;">
            <i class="fa-solid fa-shield-halved" style="color: #f59e0b;"></i> Super Admin (Central Admin Panel)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="app.quickFill('john.smith@mahavirsportsacademy.com', 'password123')" style="justify-content: flex-start;">
            <i class="fa-solid fa-building" style="color: #3b82f6;"></i> Academy Admin (Mahavir Sports)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="app.quickFill('aarav.patel@student.com', 'password123')" style="justify-content: flex-start;">
            <i class="fa-solid fa-user-graduate" style="color: #10b981;"></i> Student Portal (Aarav Patel)
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. MAIN APPLICATION SPA VIEW               -->
  <!-- ========================================== -->
  <div id="app-view" class="app-container" style="display: none;">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header" id="sidebar-header">
        <div class="brand-icon" id="sidebar-brand-icon">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <div class="brand-text" id="sidebar-brand-text">
          <h1 id="sidebar-brand-name">Sports Solutions</h1>
          <span id="sidebar-role-badge">Multi-Tenant SaaS</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav-items">
        <!-- Rendered dynamically via JavaScript based on role -->
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" onclick="app.toggleTheme()" title="Toggle Dark/Light Mode">
          <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
        <button class="btn btn-danger btn-sm" onclick="app.logout()" title="Logout">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
        </button>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="header-left">
          <div id="tenant-selector-container">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <div class="header-right">
          <!-- Dynamic Color Theme Switcher -->
          <button type="button" class="theme-picker-btn" id="header-theme-btn" onclick="app.showThemePickerModal()" title="Customize Color Theme">
            <span class="theme-indicator-dot" id="header-theme-dot"></span>
            <span id="header-theme-name" style="font-size: 12px; font-weight: 600;">Theme</span>
          </button>

          <a href="/pay.html" class="btn btn-secondary btn-sm" target="_blank">
            <i class="fa-solid fa-credit-card" style="color: #10b981;"></i> Quick Pay Portal
          </a>

          <button type="button" class="btn btn-secondary btn-sm" onclick="app.openChangeMyPasswordModal()" title="Change Account Password">
            <i class="fa-solid fa-key" style="color: #f59e0b;"></i> Password
          </button>

          <div class="user-profile-menu" onclick="app.openChangeMyPasswordModal()" style="cursor: pointer;" title="Click to Change Password">
            <div class="user-avatar" id="header-user-avatar">U</div>
            <div class="user-info">
              <span class="user-name" id="header-user-name">User Name</span>
              <span class="user-role" id="header-user-role">Role</span>
            </div>
          </div>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main class="page-content" id="page-content">
        <!-- Injected dynamically based on active tab -->
      </main>

    </div>
  </div>

  <!-- ========================================== -->
  <!-- 3. MODALS CONTAINER                        -->
  <!-- ========================================== -->
  <div id="modal-container" class="modal-overlay">
    <div class="modal-wrapper">
      <button type="button" class="modal-close-outside" onclick="app.closeModal()" title="Close (Esc)" aria-label="Close modal">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="modal-container" id="modal-dialog">
        <div class="modal-header">
          <h2 id="modal-title">Modal Title</h2>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Dynamic content -->
        </div>
        <div class="modal-footer" id="modal-footer">
          <!-- Dynamic footer buttons -->
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Hub -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Geolocation Service -->
  <script src="/js/locationService.js?v=2.2.0"></script>

  <!-- Application Logic -->
  <script src="/js/app.js?v=2.2.6"></script>
</body>
</html>
