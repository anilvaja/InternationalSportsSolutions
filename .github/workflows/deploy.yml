name: Production Deploy to GoDaddy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy Application to GoDaddy Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GODADDY_SSH_HOST }}
          username: ${{ secrets.GODADDY_SSH_USERNAME }}
          password: ${{ secrets.GODADDY_SSH_PASSWORD }}
          port: ${{ secrets.GODADDY_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.GODADDY_APP_PATH || '~/public_html' }}
            bash scripts/deploy.sh
